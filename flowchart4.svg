<svg width="1340" height="300" viewBox="0 0 1340 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1340" height="300" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g fill="#5FA8E0" stroke="#4A8FC7" stroke-width="1" font-family="Arial, sans-serif">
<rect x="40" y="120" width="100" height="60" rx="30"/>
<text x="90" y="154" text-anchor="middle" font-size="11" fill="#111">Start</text>
<line x1="140" y1="150" x2="186" y2="150" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<polygon points="210,110 330,110 310,190 190,190"/>
<text x="260" y="145" text-anchor="middle" font-size="9.5" fill="#111">Input Health &amp;</text>
<text x="260" y="163" text-anchor="middle" font-size="9.5" fill="#111">spell_shield_is_active</text>
<line x1="330" y1="150" x2="376" y2="150" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="380" y="110" width="180" height="80"/>
<text x="470" y="142" text-anchor="middle" font-size="9.5" fill="#111">Generate a random</text>
<text x="470" y="160" text-anchor="middle" font-size="9.5" fill="#111">number 1-10 as attack</text>
<text x="470" y="178" text-anchor="middle" font-size="9.5" fill="#111">strength</text>
<line x1="560" y1="150" x2="606" y2="150" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<polygon points="680,100 750,150 680,200 610,150"/>
<text x="680" y="142" text-anchor="middle" font-size="9.5" fill="#111">Is spell_shield</text>
<text x="680" y="160" text-anchor="middle" font-size="9.5" fill="#111">activated</text>
</g>
<path d="M680,100 L680,70 L800,70" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="685" y="83" font-size="10" fill="#111" font-family="Arial, sans-serif">Yes</text>
<path d="M680,200 L680,225 L800,225" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="685" y="213" font-size="10" fill="#111" font-family="Arial, sans-serif">No</text>
<g fill="#5FA8E0" stroke="#4A8FC7" stroke-width="1" font-family="Arial, sans-serif">
<polygon points="816,45 944,45 928,95 800,95"/>
<text x="864" y="63" text-anchor="middle" font-size="9.5" fill="#111">Reduce health</text>
<text x="864" y="81" text-anchor="middle" font-size="9.5" fill="#111">by half of attack str.</text>
<polygon points="816,200 944,200 928,250 800,250"/>
<text x="864" y="218" text-anchor="middle" font-size="9.5" fill="#111">Reduce health</text>
<text x="864" y="236" text-anchor="middle" font-size="9.5" fill="#111">by full attack str.</text>
</g>
<path d="M928,70 L960,70 L960,140 L980,140" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M928,225 L960,225 L960,160 L980,160" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<g fill="#5FA8E0" stroke="#4A8FC7" stroke-width="1" font-family="Arial, sans-serif">
<rect x="980" y="120" width="160" height="60"/>
<text x="1060" y="154" text-anchor="middle" font-size="10.5" fill="#111">Effect of attack</text>
<line x1="1140" y1="150" x2="1196" y2="150" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="1200" y="120" width="100" height="60" rx="30"/>
<text x="1250" y="154" text-anchor="middle" font-size="11" fill="#111">End</text>
</g>
</svg>
