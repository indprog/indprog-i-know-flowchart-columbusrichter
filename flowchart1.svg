<svg width="1018" height="270" viewBox="0 0 1018 270" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1018" height="270" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Start (stadium) -->
  <rect x="148" y="122" width="105" height="55" rx="27.5" fill="#5FA8E0" stroke="#4A8FC7" stroke-width="1"/>
  <text x="200" y="154" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#111111">Start</text>

  <!-- arrow: Start -> Draw a face -->
  <line x1="253" y1="150" x2="322" y2="150" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Draw a face (rectangle) -->
  <rect x="327" y="107" width="142" height="86" fill="#5FA8E0" stroke="#4A8FC7" stroke-width="1"/>
  <text x="398" y="153" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#111111">Draw a face</text>

  <!-- arrow: Draw a face -> three guidelines -->
  <line x1="469" y1="150" x2="538" y2="150" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- three guidelines (rectangle) -->
  <rect x="543" y="107" width="132" height="86" fill="#5FA8E0" stroke="#4A8FC7" stroke-width="1"/>
  <text x="609" y="145" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#111111">three guidelines (for the</text>
  <text x="609" y="160" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#111111">center and the nose)</text>

  <!-- arrow: three guidelines -> End -->
  <line x1="675" y1="150" x2="772" y2="150" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- End (stadium) -->
  <rect x="783" y="122" width="105" height="55" rx="27.5" fill="#5FA8E0" stroke="#4A8FC7" stroke-width="1"/>
  <text x="835" y="154" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#111111">End</text>
</svg>
